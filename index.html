<style>
:root{--bg:#EEF1FB;--card:#fff;--ink:#1B2A49;--mute:#5d6b8a;--line:#c9d1ea;--acc:#F2B705;--accink:#3a2c00;--ok:#1f9d63;--bad:#d9433b;--key:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a2e;--card:#1b2542;--ink:#eef1fb;--mute:#9aa7c7;--line:#33415f;--key:#eef1fb;--accink:#3a2c00}}
:root[data-theme="dark"]{--bg:#121a2e;--card:#1b2542;--ink:#eef1fb;--mute:#9aa7c7;--line:#33415f;--key:#eef1fb}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Nunito,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 96px}
h1,h2,h3{font-family:Fredoka,system-ui,sans-serif;font-weight:600;margin:0}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
header h1{font-size:28px}
nav{display:flex;gap:6px}
nav button,.btn{font:700 15px Nunito,sans-serif;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer}
nav button[aria-pressed=true],.btn.p{background:var(--ink);color:var(--bg)}
.btn.y{background:var(--acc);border-color:var(--acc);color:var(--accink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.unit{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;color:var(--ink);font:inherit}
.unit[disabled]{opacity:.45;cursor:not-allowed}
.unit .n{width:40px;height:40px;border-radius:50%;background:var(--acc);color:var(--accink);display:grid;place-items:center;font:600 18px Fredoka}
.unit small{color:var(--mute);display:block}
.stars{margin-left:auto;letter-spacing:2px;color:var(--acc);font-size:20px}
input[type=text]{font:inherit;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:100%;margin:8px 0 12px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
svg.staff{width:100%;height:auto;background:var(--card);border-radius:18px;border:1px solid var(--line)}
svg.staff .l{stroke:var(--ink);stroke-width:1.5}
svg.staff .h{fill:var(--ink)}
svg.staff text{fill:var(--ink)}
.keys{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0 8px}
.keys button{height:104px;border-radius:0 0 12px 12px;border:2px solid var(--ink);background:var(--key);color:#1B2A49;font:600 17px Fredoka;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;cursor:pointer}
.keys button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.keys button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.msg{min-height:28px;text-align:center;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat b{display:block;font:600 26px Fredoka}
.stat span{color:var(--mute);font-size:13px}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 10px;margin:2px;font-weight:700}
.note{color:var(--mute);font-size:13px;text-align:center;margin-top:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
nav.wheel{width:auto;flex:1 1 0;min-width:0;overflow-x:scroll;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;box-sizing:border-box;padding:8px calc(50% - 44px);gap:4px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent)}nav.wheel::-webkit-scrollbar{display:none}nav.wheel button{flex:none;scroll-snap-align:center;scroll-snap-stop:always;will-change:transform,opacity;transform-origin:center}
@media (max-width:430px){header{flex-wrap:wrap;gap:8px}nav.wheel{width:100%;flex:1 1 100%;padding:8px calc(50% - 44px)!important}nav button{padding:6px 10px;font-size:14px}}
.ln{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px dashed var(--line)}
.ln b{font:600 22px Fredoka;min-width:52px;color:var(--ink)}.ln span{color:var(--mute)}

i0h:['O que é uma nota musical?','What is a musical note?','¿Qué es una nota musical?','Qu’est-ce qu’une note de musique ?'],
i0a:['Todo som tem uma <b>altura</b>: ele pode ser <b>grave</b> (mais grosso) ou <b>agudo</b> (mais fino).','Every sound has a <b>pitch</b>: it can be <b>low</b> (deeper) or <b>high</b> (thinner).','Todo sonido tiene una <b>altura</b>: puede ser <b>grave</b> (más grueso) o <b>agudo</b> (más fino).','Tout son a une <b>hauteur</b> : il peut être <b>grave</b> (plus épais) ou <b>aigu</b> (plus fin).'],
i0b:['Uma <b>nota musical</b> é o nome que damos a cada altura de som usada na música. Com poucas notas combinadas, fazemos todas as melodias.','A <b>musical note</b> is the name we give to each pitch used in music. With just a few notes combined, we make every melody.','Una <b>nota musical</b> es el nombre que damos a cada altura de sonido usada en la música. Con pocas notas combinadas hacemos todas las melodías.','Une <b>note de musique</b> est le nom donné à chaque hauteur de son utilisée en musique. Avec quelques notes combinées, on crée toutes les mélodies.'],
lowB:['Ouvir um som grave','Hear a low sound','Oír un sonido grave','Écouter un son grave'],highB:['Ouvir um som agudo','Hear a high sound','Oír un sonido agudo','Écouter un son aigu'],
i1h:['As 7 notas musicais','The 7 musical notes','Las 7 notas musicales','Les 7 notes de musique'],i1a:['Na música ocidental usamos 7 nomes de notas, sempre nesta ordem:','In Western music we use 7 note names, always in this order:','En la música occidental usamos 7 nombres de notas, siempre en este orden:','Dans la musique occidentale, on utilise 7 noms de notes, toujours dans cet ordre :'],
i1b:['Toque em cada tecla para ouvir:','Tap each key to hear it:','Toca cada tecla para oírla:','Touche chaque touche pour l’écouter :'],
i2h:['Elas se repetem','They repeat','Se repiten','Elles se répètent'],
i2a:['Depois do {0}, voltamos ao {1}, só que <b>mais agudo</b>. Esse intervalo, de um {1} até o próximo, se chama <b>oitava</b>: o {1} de chegada é a 8ª nota contando a partir do primeiro.','After {0}, we return to {1}, only <b>higher</b>. This span, from one {1} to the next, is called an <b>octave</b>: the arrival {1} is the 8th note counting from the first.','Después de {0}, volvemos a {1}, pero <b>más agudo</b>. Ese intervalo, de un {1} al siguiente, se llama <b>octava</b>: el {1} de llegada es la 8.ª nota contando desde el primero.','Après {0}, on revient à {1}, mais <b>plus aigu</b>. Cet écart, d’un {1} au suivant, s’appelle une <b>octave</b> : le {1} d’arrivée est la 8e note en comptant depuis le premier.'],
i2b:['O mesmo desenho de 7 notas se repete para o agudo e para o grave.','The same pattern of 7 notes repeats higher and lower.','El mismo dibujo de 7 notas se repite hacia el agudo y el grave.','Le même motif de 7 notes se répète vers l’aigu et le grave.'],
upB:['Ouvir subindo','Hear it going up','Oír subiendo','Écouter en montant'],dnB:['Ouvir descendo','Hear it going down','Oír bajando','Écouter en descendant'],
i3h:['De onde vêm os nomes?','Where do the names come from?','¿De dónde vienen los nombres?','D’où viennent les noms ?'],
i3a:['Há cerca de mil anos, na Itália, um monge chamado <b>Guido d’Arezzo</b> ensinava cantores a aprender melodias rápido. Ele usou um hino antigo em latim para São João Batista: cada verso começa <b>um degrau acima</b> do anterior. A primeira sílaba de cada verso virou o nome de uma nota:','About a thousand years ago in Italy, a monk named <b>Guido d’Arezzo</b> taught singers to learn melodies fast. He used an old Latin hymn to Saint John the Baptist: each line starts <b>one step higher</b> than the last. The first syllable of each line became the name of a note:','Hace unos mil años, en Italia, un monje llamado <b>Guido d’Arezzo</b> enseñaba a los cantantes a aprender melodías rápido. Usó un antiguo himno en latín a San Juan Bautista: cada verso empieza <b>un escalón más arriba</b> que el anterior. La primera sílaba de cada verso se convirtió en el nombre de una nota:','Il y a environ mille ans, en Italie, un moine nommé <b>Guido d’Arezzo</b> apprenait aux chanteurs à retenir vite les mélodies. Il a utilisé un vieil hymne latin à saint Jean-Baptiste : chaque vers commence <b>une marche plus haut</b> que le précédent. La première syllabe de chaque vers est devenue le nom d’une note :'],
i3b:['O <b>Si</b> veio mais tarde, das iniciais de <i>Sancte Ioannes</i>. E o <b>Ut</b> foi trocado por <b>Dó</b> séculos depois, porque é mais fácil de cantar (a troca costuma ser atribuída ao italiano Giovanni Battista Doni, no século XVII).','The <b>Si</b> came later, from the initials of <i>Sancte Ioannes</i> (English speakers later changed it to <b>Ti</b>). And <b>Ut</b> was replaced by <b>Do</b> centuries later because it is easier to sing (the change is usually credited to the Italian Giovanni Battista Doni, in the 1600s).','El <b>Si</b> llegó después, de las iniciales de <i>Sancte Ioannes</i>. Y <b>Ut</b> se cambió por <b>Do</b> siglos más tarde, porque es más fácil de cantar (el cambio suele atribuirse al italiano Giovanni Battista Doni, en el siglo XVII).','Le <b>Si</b> est venu plus tard, des initiales de <i>Sancte Ioannes</i>. Et <b>Ut</b> a été remplacé par <b>Do</b> des siècles après, car plus facile à chanter (changement souvent attribué à l’Italien Giovanni Battista Doni, au XVIIe siècle).'],
scB:['Ouvir a escala','Hear the scale','Oír la escala','Écouter la gamme'],hist:['Historiadores divergem em datas e detalhes.','Historians disagree on dates and details.','Los historiadores discrepan en fechas y detalles.','Les historiens divergent sur les dates et les détails.'],
i4h:['E as letras A B C D E F G?','And the letters A B C D E F G?','¿Y las letras A B C D E F G?','Et les lettres A B C D E F G ?'],
i4a:['Você também vai ver as notas com letras, como nas cifras de violão e nas partituras em inglês e alemão. As letras vêm de um sistema <b>mais antigo</b> que os nomes {0}: a escala medieval começava no <b>A</b>, que por isso é o <b>{1}</b>.','You will also see notes as letters, as in guitar chord charts and in English and German scores. The letters come from a system <b>older</b> than the names {0}: the medieval scale started on <b>A</b>, which is why it is <b>{1}</b>.','También verás las notas con letras, como en las cifras de guitarra y en partituras en inglés y alemán. Las letras vienen de un sistema <b>más antiguo</b> que los nombres {0}: la escala medieval empezaba en <b>A</b>, que por eso es <b>{1}</b>.','Tu verras aussi les notes en lettres, comme dans les grilles d’accords de guitare et les partitions anglaises et allemandes. Les lettres viennent d’un système <b>plus ancien</b> que les noms {0} : la gamme médiévale commençait sur <b>A</b>, qui est donc <b>{1}</b>.'],
i4b:['Com o tempo, o {0} virou o ponto de partida da escala mais usada, mas as letras não mudaram. Por isso <b>C = {0}</b>, e não A.','Over time, {0} became the starting point of the most used scale, but the letters did not change. That is why <b>C = {0}</b>, not A.','Con el tiempo, {0} pasó a ser el punto de partida de la escala más usada, pero las letras no cambiaron. Por eso <b>C = {0}</b>, y no A.','Avec le temps, {0} est devenu le point de départ de la gamme la plus utilisée, mais les lettres n’ont pas changé. C’est pourquoi <b>C = {0}</b>, et non A.'],
i4c:['Toque para ouvir cada nota.','Tap to hear each note.','Toca para oír cada nota.','Touche pour écouter chaque note.'],
i5h:['Pronto, você já sabe o básico!','Done, you know the basics!','¡Listo, ya sabes lo básico!','Bravo, tu connais les bases !'],i5a:['Você aprendeu que:','You learned that:','Aprendiste que:','Tu as appris que :'],
i5l:['• uma nota é o nome de uma altura de som;<br>• existem 7 notas: {0};<br>• depois do {1}, tudo se repete em uma nova oitava;<br>• os nomes vêm de um hino antigo, e as letras (A a G) de um sistema ainda mais antigo;<br>• {2}.','• a note is the name of a pitch;<br>• there are 7 notes: {0};<br>• after {1}, everything repeats in a new octave;<br>• the names come from an old hymn, and the letters (A to G) from an even older system;<br>• {2}.','• una nota es el nombre de una altura de sonido;<br>• hay 7 notas: {0};<br>• después de {1}, todo se repite en una nueva octava;<br>• los nombres vienen de un himno antiguo, y las letras (A a G) de un sistema aún más antiguo;<br>• {2}.','• une note est le nom d’une hauteur de son ;<br>• il y a 7 notes : {0} ;<br>• après {1}, tout se répète dans une nouvelle octave ;<br>• les noms viennent d’un vieil hymne, et les lettres (A à G) d’un système encore plus ancien ;<br>• {2}.'],
i5b:['Agora vamos aprender a achar essas notas na pauta.','Now let’s learn to find these notes on the staff.','Ahora aprenderemos a encontrar estas notas en el pentagrama.','Apprenons maintenant à trouver ces notes sur la portée.'],
s1h:['O que é um acorde?','What is a chord?','¿Qué es un acorde?','Qu’est-ce qu’un accord ?'],s1p:['Acorde é um grupo de notas tocadas <b>juntas</b> que combinam entre si.','A chord is a group of notes played <b>together</b> that fit well.','Un acorde es un grupo de notas tocadas <b>juntas</b> que combinan entre sí.','Un accord est un groupe de notes jouées <b>ensemble</b> qui vont bien ensemble.'],
s2h:['E o que é uma tríade?','And what is a triad?','¿Y qué es una tríada?','Et qu’est-ce qu’une triade ?'],s2p:['É o acorde mais simples, feito com <b>3 notas</b>. Você junta 3 notas e elas viram 1 só som.','It is the simplest chord, made of <b>3 notes</b>. Put 3 notes together and they become one sound.','Es el acorde más simple, hecho con <b>3 notas</b>. Juntas 3 notas y se vuelven un solo sonido.','C’est l’accord le plus simple, fait de <b>3 notes</b>. Tu réunis 3 notes et elles forment un seul son.'],
s3h:['Como montar','How to build one','Cómo armarlo','Comment le former'],
s3p:['1. Escolha uma nota para começar. Ela dá o nome ao acorde e se chama <b>tônica</b>.<br>2. Pule uma tecla branca e toque a seguinte: essa é a <b>terça</b>.<br>3. Pule mais uma tecla branca e toque a seguinte: essa é a <b>quinta</b>.','1. Pick a note to start. It names the chord and is called the <b>root</b>.<br>2. Skip one white key and play the next: that is the <b>third</b>.<br>3. Skip one more white key and play the next: that is the <b>fifth</b>.','1. Elige una nota para empezar. Da nombre al acorde y se llama <b>tónica</b>.<br>2. Salta una tecla blanca y toca la siguiente: esa es la <b>tercera</b>.<br>3. Salta otra tecla blanca y toca la siguiente: esa es la <b>quinta</b>.','1. Choisis une note pour commencer. Elle donne son nom à l’accord : la <b>tonique</b>.<br>2. Saute une touche blanche et joue la suivante : c’est la <b>tierce</b>.<br>3. Saute encore une touche blanche et joue la suivante : c’est la <b>quinte</b>.'],
s4p:['Dica: <b>pule uma, toque uma</b>.','Tip: <b>skip one, play one</b>.','Pista: <b>salta una, toca una</b>.','Astuce : <b>saute une, joue une</b>.'],
s5p:['Nas teclas pretas vale a mesma ideia. Andando tecla por tecla (pretas e brancas), a terça maior é a 4ª tecla depois da tônica e a quinta é a 7ª. No acorde menor, a terça é a 3ª.','Black keys work the same way. Moving key by key (black and white), the major third is the 4th key after the root and the fifth is the 7th. In a minor chord, the third is the 3rd.','En las teclas negras vale la misma idea. Avanzando tecla por tecla (negras y blancas), la tercera mayor es la 4.ª tecla después de la tónica y la quinta es la 7.ª. En el acorde menor, la tercera es la 3.ª.','Même idée avec les touches noires. En avançant touche par touche (noires et blanches), la tierce majeure est la 4e touche après la tonique et la quinte la 7e. Dans un accord mineur, la tierce est la 3e.'],
s7p:['{0} + {1} + {2} tocadas juntas formam o acorde de <b>{3}</b>.','{0} + {1} + {2} played together make the chord <b>{3}</b>.','{0} + {1} + {2} tocadas juntas forman el acorde de <b>{3}</b>.','{0} + {1} + {2} jouées ensemble forment l’accord de <b>{3}</b>.'],
s8p:['Acordes maiores costumam soar mais alegres. Os menores soam mais sérios ou tristes.','Major chords usually sound happier. Minor ones sound more serious or sad.','Los acordes mayores suelen sonar más alegres. Los menores suenan más serios o tristes.','Les accords majeurs sonnent souvent plus joyeux. Les mineurs sonnent plus sérieux ou tristes.'],
close:['Fechar','Close','Cerrar','Fermer'],fabA:['Como montar um acorde','How to build a chord','Cómo armar un acorde','Comment former un accord'],fab2A:['O que são pauta e clave','What are staff and clef','Qué son pentagrama y clave','Portée et clé'],
c1h:['O que é a pauta?','What is the staff?','¿Qué es el pentagrama?','Qu’est-ce que la portée ?'],
c1p:['São as <b>5 linhas</b> onde as notas ficam e os <b>4 espaços</b> entre elas. Uma nota pode estar <b>sobre uma linha</b> ou <b>dentro de um espaço</b>. Contamos linhas e espaços de baixo para cima. Quanto mais alta a nota, mais aguda ela soa. Quanto mais baixa, mais grave.','The <b>5 lines</b> where notes sit, and the <b>4 spaces</b> between them. A note can sit <b>on a line</b> or <b>in a space</b>. We count lines and spaces from bottom to top. The higher the note, the higher it sounds. The lower, the deeper.','Son las <b>5 líneas</b> donde van las notas y los <b>4 espacios</b> entre ellas. Una nota puede estar <b>sobre una línea</b> o <b>dentro de un espacio</b>. Contamos líneas y espacios de abajo hacia arriba. Cuanto más alta la nota, más aguda suena. Cuanto más baja, más grave.','Ce sont les <b>5 lignes</b> où se placent les notes et les <b>4 interlignes</b> entre elles. Une note peut être <b>sur une ligne</b> ou <b>dans un interligne</b>. On compte lignes et interlignes de bas en haut. Plus la note est haute, plus elle est aiguë ; plus elle est basse, plus elle est grave.'],
c1q:['Notas que não cabem nas 5 linhas ganham uma linhazinha extra, a <b>linha suplementar</b>.','Notes that do not fit on the 5 lines get a small extra line, the <b>ledger line</b>.','Las notas que no caben en las 5 líneas reciben una rayita extra, la <b>línea adicional</b>.','Les notes hors des 5 lignes reçoivent une petite ligne en plus, la <b>ligne supplémentaire</b>.'],
c2h:['O que é a clave?','What is a clef?','¿Qué es la clave?','Qu’est-ce qu’une clé ?'],
c2p:['É o símbolo no começo da pauta. Ele diz o <b>nome das notas</b>. A mesma posição vira outra nota quando a clave muda.','It is the symbol at the start of the staff. It tells the <b>names of the notes</b>. The same position becomes another note when the clef changes.','Es el símbolo al comienzo del pentagrama. Indica el <b>nombre de las notas</b>. La misma posición es otra nota cuando cambia la clave.','C’est le symbole au début de la portée. Il indique le <b>nom des notes</b>. La même position devient une autre note quand la clé change.'],

c5h:['Sustenido e bemol','Sharp and flat','Sostenido y bemol','Dièse et bémol'],c5p:['O <b>sustenido (♯)</b> sobe a nota meio tom e o <b>bemol (♭)</b> desce meio tom. No piano, em geral são as teclas pretas. Uma mesma tecla preta tem dois nomes: {0} = {1}.','The <b>sharp (♯)</b> raises a note by a half step and the <b>flat (♭)</b> lowers it by a half step. On the piano, they are usually the black keys. The same black key has two names: {0} = {1}.','El <b>sostenido (♯)</b> sube la nota medio tono y el <b>bemol (♭)</b> la baja medio tono. En el piano suelen ser las teclas negras. Una misma tecla negra tiene dos nombres: {0} = {1}.','Le <b>dièse (♯)</b> monte la note d’un demi-ton et le <b>bémol (♭)</b> la descend d’un demi-ton. Au piano, ce sont en général les touches noires. Une même touche noire a deux noms : {0} = {1}.'],
c6h:['Ritmo: figuras e compasso','Rhythm: note values and measures','Ritmo: figuras y compás','Rythme : figures et mesures'],c6p:['Cada figura dura um número de <b>tempos</b>: {0} = 4, {1} = 2, {2} = 1, {3} = ½. A fórmula de compasso mostra quantos tempos cabem em cada compasso: 2 em 2/4, 3 em 3/4 e 4 em 4/4. O 4 de baixo diz que cada tempo é uma {2}.','Each note lasts a number of <b>beats</b>: {0} = 4, {1} = 2, {2} = 1, {3} = ½. The time signature shows how many beats fit in each measure: 2 in 2/4, 3 in 3/4 and 4 in 4/4. The bottom 4 says each beat is a {2}.','Cada figura dura un número de <b>tiempos</b>: {0} = 4, {1} = 2, {2} = 1, {3} = ½. La fórmula de compás indica cuántos tiempos caben en cada compás: 2 en 2/4, 3 en 3/4 y 4 en 4/4. El 4 de abajo dice que cada tiempo es una {2}.','Chaque figure dure un nombre de <b>temps</b> : {0} = 4, {1} = 2, {2} = 1, {3} = ½. Le chiffrage indique combien de temps tiennent dans chaque mesure : 2 à 2/4, 3 à 3/4 et 4 à 4/4. Le 4 du bas dit que chaque temps est une {2}.'],

c8p:['Figuras são os desenhos que mostram quanto tempo cada nota dura. Contamos essa duração em <b>tempos</b>, como as batidas de um coração.','Note values are the symbols that show how long each note lasts. We count that length in <b>beats</b>, like a heartbeat.','Las figuras son los dibujos que muestran cuánto dura cada nota. Esa duración se cuenta en <b>tiempos</b>, como los latidos de un corazón.','Les figures sont les symboles qui montrent combien de temps dure chaque note. On compte cette durée en <b>temps</b>, comme des battements de cœur.'],

chHelp:['Aceita cifras em inglês (C, Dm7, G7) ou nomes em português (Dó, Ré menor). Use # e b para sustenido e bemol, e / para o baixo (C/E). Funcionam maj, m, dim, aug, sus, add, 6, 7, 9, 11, 13 e alterações como b9, #9, #11, b13.','Accepts chord symbols (C, Dm7, G7) or note names (Do, Re minor). Use # and b for sharp and flat, and / for the bass note (C/E). Works with maj, m, dim, aug, sus, add, 6, 7, 9, 11, 13 and alterations such as b9, #9, #11, b13.','Acepta cifras (C, Dm7, G7) o nombres (Do, Re menor). Usa # y b para sostenido y bemol, y / para el bajo (C/E). Funcionan maj, m, dim, aug, sus, add, 6, 7, 9, 11, 13 y alteraciones como b9, #9, #11, b13.','Accepte les chiffrages (C, Dm7, G7) ou les noms (Do, Ré mineur). Utilise # et b pour dièse et bémol, et / pour la basse (C/E). Fonctionne avec maj, m, dim, aug, sus, add, 6, 7, 9, 11, 13 et les altérations comme b9, #9, #11, b13.'],

c9p:['A <b>pausa</b> é um silêncio com duração: 4 tempos (pendurada na linha), 2 (sentada na linha), 1 (em zigue-zague) e ½ (com uma bandeirola). O <b>ponto de aumento</b> soma metade do valor da figura: 2 + 1 = 3 tempos. A <b>ligadura</b> é uma curva que une duas notas iguais em um só som, somando os tempos. O <b>bequadro (♮)</b> cancela um sustenido ou bemol.','A <b>rest</b> is a silence with a length: 4 beats (hangs from the line), 2 (sits on the line), 1 (zigzag) and ½ (with a small flag). A <b>dot</b> adds half the value of the note: 2 + 1 = 3 beats. A <b>tie</b> is a curve joining two equal notes into one sound, adding their beats. A <b>natural (♮)</b> cancels a sharp or flat.','El <b>silencio</b> tiene duración: 4 tiempos (cuelga de la línea), 2 (se sienta sobre la línea), 1 (en zigzag) y ½ (con un corchete). El <b>puntillo</b> suma la mitad del valor de la figura: 2 + 1 = 3 tiempos. La <b>ligadura</b> es una curva que une dos notas iguales en un solo sonido, sumando los tiempos. El <b>becuadro (♮)</b> cancela un sostenido o bemol.','Le <b>silence</b> a une durée : 4 temps (suspendu à la ligne), 2 (posé sur la ligne), 1 (en zigzag) et ½ (avec un crochet). Le <b>point</b> ajoute la moitié de la valeur : 2 + 1 = 3 temps. La <b>liaison</b> est une courbe qui unit deux notes identiques en un seul son, en additionnant les temps. Le <b>bécarre (♮)</b> annule un dièse ou un bémol.'],
c10h:['Armadura, escala e intervalo','Key signature, scale and interval','Armadura, escala e intervalo','Armure, gamme et intervalle'],
c10p:['A <b>armadura</b> são os sustenidos ou bemóis logo depois da clave e valem para a música toda: {3} maior tem {0}; {4} maior tem {0} e {1}; {5} maior tem {2}. A <b>escala maior</b> segue o padrão tom, tom, semitom, tom, tom, tom, semitom. O <b>intervalo</b> é a distância entre duas notas, contando a primeira e a última: de {6} a {3} é uma 5ª.','The <b>key signature</b> is the sharps or flats right after the clef and applies to the whole piece: {3} major has {0}; {4} major has {0} and {1}; {5} major has {2}. The <b>major scale</b> follows whole, whole, half, whole, whole, whole, half. An <b>interval</b> is the distance between two notes, counting the first and the last: {6} to {3} is a 5th.','La <b>armadura</b> son los sostenidos o bemoles justo después de la clave y valen para toda la obra: {3} mayor tiene {0}; {4} mayor tiene {0} y {1}; {5} mayor tiene {2}. La <b>escala mayor</b> sigue el patrón tono, tono, semitono, tono, tono, tono, semitono. El <b>intervalo</b> es la distancia entre dos notas, contando la primera y la última: de {6} a {3} es una 5.ª.','L’<b>armure</b> regroupe les dièses ou bémols placés après la clé et vaut pour tout le morceau : {3} majeur a {0} ; {4} majeur a {0} et {1} ; {5} majeur a {2}. La <b>gamme majeure</b> suit le modèle ton, ton, demi-ton, ton, ton, ton, demi-ton. L’<b>intervalle</b> est la distance entre deux notes, en comptant la première et la dernière : de {6} à {3}, c’est une 5e.'],

c11h:['Escala menor','The minor scale','La escala menor','La gamme mineure'],
c11p:['Cada tonalidade maior tem uma <b>relativa menor</b> com as mesmas notas: {0} menor é a relativa de {1} maior. A escala menor <b>natural</b> segue tom, semitom, tom, tom, semitom, tom, tom. Na <b>harmônica</b>, a 7ª nota sobe meio tom, o que cria um salto de tom e meio. Na <b>melódica</b>, a 6ª e a 7ª sobem na ida e voltam ao natural na descida.','Every major key has a <b>relative minor</b> with the same notes: {0} minor is the relative of {1} major. The <b>natural</b> minor scale follows whole, half, whole, whole, half, whole, whole. In the <b>harmonic</b> one, the 7th note is raised a half step, creating a step-and-a-half leap. In the <b>melodic</b> one, the 6th and 7th go up on the way up and return to natural on the way down.','Cada tonalidad mayor tiene una <b>relativa menor</b> con las mismas notas: {0} menor es la relativa de {1} mayor. La escala menor <b>natural</b> sigue tono, semitono, tono, tono, semitono, tono, tono. En la <b>armónica</b>, la 7.ª nota sube medio tono, lo que crea un salto de tono y medio. En la <b>melódica</b>, la 6.ª y la 7.ª suben al ascender y vuelven a la natural al descender.','Chaque tonalité majeure a une <b>relative mineure</b> avec les mêmes notes : {0} mineur est la relative de {1} majeur. La gamme mineure <b>naturelle</b> suit ton, demi-ton, ton, ton, demi-ton, ton, ton. Dans l’<b>harmonique</b>, la 7e note monte d’un demi-ton, ce qui crée un saut d’un ton et demi. Dans la <b>mélodique</b>, les 6e et 7e montent à la montée et reviennent au naturel à la descente.'],

c12p:['Na clave de fá, os mesmos sustenidos e bemóis ficam em outras posições: o {0} na 4ª linha (a linha do Fá), o {1} no 2º espaço e o {2} na 2ª linha.','In the bass clef, the same sharps and flats sit in other places: {0} on the 4th line (the F line), {1} in the 2nd space and {2} on the 2nd line.','En la clave de fa, los mismos sostenidos y bemoles van en otras posiciones: el {0} en la 4.ª línea (la línea del Fa), el {1} en el 2.º espacio y el {2} en la 2.ª línea.','En clé de fa, les mêmes dièses et bémols se placent ailleurs : le {0} sur la 4e ligne (la ligne du Fa), le {1} dans le 2e interligne et le {2} sur la 2e ligne.'],

'],qMM:['O acorde é maior ou menor?','Is the chord major or minor?','¿El acorde es mayor o menor?','L’accord est-il majeur ou mineur ?'],qIV:['Qual é o intervalo?','What is the interval?','¿Cuál es el intervalo?','Quel est l’intervalle ?'],qSC:['Que tipo de escala é esta?','What kind of scale is this?','¿Qué tipo de escala es esta?','Quel type de gamme est-ce ?'],qRD:['Qual ritmo você ouviu?','Which rhythm did you hear?','¿Qué ritmo escuchaste?','Quel rythme as-tu entendu ?'],qDI:['Toque no piano as notas que você ouviu, na ordem.','Play the notes you heard on the piano, in order.','Toca en el piano las notas que oíste, en orden.','Joue au piano les notes entendues, dans l’ordre.'],qTR:['Que tipo de acorde é este?','What type of chord is this?','¿Qué tipo de acorde es este?','Quel type d’accord est-ce ?'],qSV:['Que acorde de sétima é este?','Which seventh chord is this?','¿Qué acorde de séptima es este?','Quel accord de septième est-ce ?'],qMO:['Que modo é este?','Which mode is this?','¿Qué modo es este?','Quel mode est-ce ?'],qPR:['Qual progressão de acordes você ouviu?','Which chord progression did you hear?','¿Qué progresión de acordes escuchaste?','Quelle progression d’accords as-tu entendue ?'],ivn:['2ª menor|2ª maior|3ª menor|3ª maior|4ª justa|Trítono|5ª justa|6ª menor|6ª maior|7ª menor|7ª maior|Oitava','Minor 2nd|Major 2nd|Minor 3rd|Major 3rd|Perfect 4th|Tritone|Perfect 5th|Minor 6th|Major 6th|Minor 7th|Major 7th|Octave','2.ª menor|2.ª mayor|3.ª menor|3.ª mayor|4.ª justa|Tritono|5.ª justa|6.ª menor|6.ª mayor|7.ª menor|7.ª mayor|Octava','Seconde mineure|Seconde majeure|Tierce mineure|Tierce majeure|Quarte juste|Triton|Quinte juste|Sixte mineure|Sixte majeure|Septième mineure|Septième majeure|Octave'],trN:['Maior|Menor|Diminuta|Aumentada','Major|Minor|Diminished|Augmented','Mayor|Menor|Disminuida|Aumentada','Majeure|Mineure|Diminuée|Augmentée'],sevN:['maj7 (sétima maior)|7 (dominante)|m7 (menor com sétima)|m7♭5 (meio-diminuto)','maj7 (major seventh)|7 (dominant)|m7 (minor seventh)|m7♭5 (half-diminished)','maj7 (séptima mayor)|7 (dominante)|m7 (menor con séptima)|m7♭5 (semidisminuido)','maj7 (septième majeure)|7 (dominante)|m7 (mineur septième)|m7♭5 (demi-diminué)'],modN:['Jônio (maior)|Dórico|Mixolídio|Eólio (menor natural)','Ionian (major)|Dorian|Mixolydian|Aeolian (natural minor)','Jónico (mayor)|Dórico|Mixolidio|Eolio (menor natural)','Ionien (majeur)|Dorien|Mixolydien|Éolien (mineur naturel)'],eU1:['Grave ou agudo|Qual nota soa mais aguda','High or low|Which note sounds higher','Grave o agudo|Qué nota suena más aguda','Grave ou aigu|Quelle note est la plus aiguë'],eU2:['Sobe ou desce|A direção da melodia','Up or down|The direction of the melody','Sube o baja|La dirección de la melodía','Monte ou descend|Le sens de la mélodie'],eU3:['Longo ou curto|Compare a duração das notas','Long or short|Compare note lengths','Largo o corto|Compara la duración de las notas','Long ou court|Compare la durée des notes'],eU4:['Pulso e compasso|Conte os tempos de cada compasso','Pulse and meter|Count the beats in each measure','Pulso y compás|Cuenta los tiempos de cada compás','Pulsation et mesure|Compte les temps de chaque mesure'],eU5:['Maior ou menor|Reconheça o acorde pelo som','Major or minor|Recognize the chord by sound','Mayor o menor|Reconoce el acorde por el sonido','Majeur ou mineur|Reconnais l’accord à l’oreille'],eU6:['Intervalos (1)|3ª, 4ª e 5ª','Intervals (1)|3rds, 4ths and 5ths','Intervalos (1)|3.ª, 4.ª y 5.ª','Intervalles (1)|Tierces, quartes et quintes'],eU7:['Intervalos (2)|Da 2ª menor até a oitava','Intervals (2)|From the minor 2nd to the octave','Intervalos (2)|De la 2.ª menor a la octava','Intervalles (2)|De la seconde mineure à l’octave'],eU8:['Escalas|Maior, menor natural e menor harmônica','Scales|Major, natural minor and harmonic minor','Escalas|Mayor, menor natural y menor armónica','Gammes|Majeure, mineure naturelle et harmonique'],eU9:['Ritmo escrito|Escolha o ritmo que você ouviu','Written rhythm|Pick the rhythm you heard','Ritmo escrito|Elige el ritmo que oíste','Rythme écrit|Choisis le rythme entendu'],eU10:['Ditado melódico (1)|Quatro notas na escala de Dó','Melodic dictation (1)|Four notes in the C scale','Dictado melódico (1)|Cuatro notas en la escala de Do','Dictée mélodique (1)|Quatre notes dans la gamme de Do'],eU11:['Tríades|Maior, menor, diminuta e aumentada','Triads|Major, minor, diminished and augmented','Tríadas|Mayor, menor, disminuida y aumentada','Triades|Majeure, mineure, diminuée et augmentée'],eU12:['Acordes de sétima|maj7, 7, m7 e m7♭5','Seventh chords|maj7, 7, m7 and m7♭5','Acordes de séptima|maj7, 7, m7 y m7♭5','Accords de septième|maj7, 7, m7 et m7♭5'],eU13:['Modos|Jônio, dórico, mixolídio e eólio','Modes|Ionian, Dorian, Mixolydian and Aeolian','Modos|Jónico, dórico, mixolidio y eolio','Modes|Ionien, dorien, mixolydien et éolien'],eU14:['Progressões|I–IV–V–I, ii–V–I e outras','Progressions|I–IV–V–I, ii–V–I and more','Progresiones|I–IV–V–I, ii–V–I y otras','Progressions|I–IV–V–I, ii–V–I et autres'],eU15:['Ditado melódico (2)|Seis notas, em várias tonalidades','Melodic dictation (2)|Six notes, in several keys','Dictado melódico (2)|Seis notas, en varias tonalidades','Dictée mélodique (2)|Six notes, dans plusieurs tonalités'],eH1h:['Altura e direção','Pitch and direction','Altura y dirección','Hauteur et sens'],eH1p:['Altura é o quanto um som é grave ou agudo. Compare duas notas e diga qual soa mais aguda. Uma melodia pode subir, descer ou ficar parada.','Pitch is how low or high a sound is. Compare two notes and say which sounds higher. A melody can go up, go down or stay still.','La altura es qué tan grave o agudo es un sonido. Compara dos notas y di cuál suena más aguda. Una melodía puede subir, bajar o quedarse quieta.','La hauteur dit si un son est grave ou aigu. Compare deux notes et dis laquelle est la plus aiguë. Une mélodie peut monter, descendre ou rester stable.'],eH2h:['Duração e pulso','Length and pulse','Duración y pulso','Durée et pulsation'],eH2p:['Algumas notas duram mais que outras. O pulso é a batida constante da música, e o compasso agrupa os pulsos: o primeiro de cada grupo costuma soar mais forte (2, 3 ou 4 tempos).','Some notes last longer than others. The pulse is the steady beat of the music, and the measure groups the beats: the first of each group usually sounds stronger (2, 3 or 4 beats).','Algunas notas duran más que otras. El pulso es el latido constante de la música y el compás agrupa los pulsos: el primero de cada grupo suele sonar más fuerte (2, 3 o 4 tiempos).','Certaines notes durent plus longtemps que d’autres. La pulsation est le battement régulier de la musique et la mesure regroupe les temps : le premier de chaque groupe sonne en général plus fort (2, 3 ou 4 temps).'],eH3h:['Intervalos','Intervals','Intervalos','Intervalles'],eH3p:['Intervalo é a distância entre duas notas. A 5ª justa soa aberta e estável, a 3ª maior soa alegre, a 3ª menor soa mais triste e o trítono soa tenso. Ouça também as notas juntas e descendo.','An interval is the distance between two notes. The perfect 5th sounds open and stable, the major 3rd sounds bright, the minor 3rd sounds sadder and the tritone sounds tense. Also listen to the notes together and going down.','El intervalo es la distancia entre dos notas. La 5.ª justa suena abierta y estable, la 3.ª mayor suena alegre, la 3.ª menor suena más triste y el tritono suena tenso. Escucha también las notas juntas y descendiendo.','L’intervalle est la distance entre deux notes. La quinte juste sonne ouverte et stable, la tierce majeure sonne joyeuse, la tierce mineure plus triste et le triton tendu. Écoute aussi les notes ensemble et en descendant.'],eH4h:['Acordes','Chords','Acordes','Accords'],eH4p:['Tríades: maior (alegre), menor (triste), diminuta (tensa) e aumentada (misteriosa). Acordes de sétima: maj7 (suave), 7 (pede resolução), m7 (macio) e m7♭5 (sombrio).','Triads: major (bright), minor (sad), diminished (tense) and augmented (mysterious). Seventh chords: maj7 (smooth), 7 (wants to resolve), m7 (mellow) and m7♭5 (dark).','Tríadas: mayor (alegre), menor (triste), disminuida (tensa) y aumentada (misteriosa). Acordes de séptima: maj7 (suave), 7 (pide resolución), m7 (suave) y m7♭5 (sombrío).','Triades : majeure (joyeuse), mineure (triste), diminuée (tendue) et augmentée (mystérieuse). Accords de septième : maj7 (doux), 7 (appelle une résolution), m7 (moelleux) et m7♭5 (sombre).'],eH5h:['Escalas e modos','Scales and modes','Escalas y modos','Gammes et modes'],eH5p:['A escala maior soa clara, a menor natural soa triste e a harmônica tem um salto exótico perto do fim. Entre os modos, o dórico é menor com a 6ª brilhante e o mixolídio é maior com a 7ª menor.','The major scale sounds bright, the natural minor sounds sad and the harmonic one has an exotic leap near the end. Among the modes, Dorian is minor with a bright 6th and Mixolydian is major with a minor 7th.','La escala mayor suena clara, la menor natural suena triste y la armónica tiene un salto exótico cerca del final. Entre los modos, el dórico es menor con la 6.ª brillante y el mixolidio es mayor con la 7.ª menor.','La gamme majeure sonne claire, la mineure naturelle triste et l’harmonique a un saut exotique vers la fin. Parmi les modes, le dorien est mineur avec une sixte brillante et le mixolydien est majeur avec une septième mineure.'],eH6h:['Ritmo, ditado e progressões','Rhythm, dictation and progressions','Ritmo, dictado y progresiones','Rythme, dictée et progressions'],eH6p:['Ouça o ritmo duas ou três vezes e compare com a partitura. No ditado, guarde a nota inicial (a tônica) na cabeça, ache cada nota pelo som e confira no piano. Nas progressões, ouça para onde cada acorde “quer ir”.','Listen to the rhythm two or three times and compare it with the score. In dictation, keep the starting note (the tonic) in your head, find each note by ear and check it on the piano. In progressions, listen for where each chord “wants to go”.','Escucha el ritmo dos o tres veces y compáralo con la partitura. En el dictado, guarda en la cabeza la nota inicial (la tónica), encuentra cada nota de oído y compruébala en el piano. En las progresiones, escucha adónde “quiere ir” cada acorde.','Écoute le rythme deux ou trois fois et compare-le à la partition. En dictée, garde la note de départ (la tonique) en tête, trouve chaque note à l’oreille et vérifie au piano. Dans les progressions, écoute où chaque accord « veut aller ».'],staffA:['Uma nota na pauta','A note on the staff','Una nota en el pentagrama','Une note sur la portée']

 if(off>0)o+=`<text x="4" y="${y0+dy*.7}" font-size="12" font-weight="800" fill="var(--ink)">${mn}</text>`;
 for(let s=0;s<6;s++)o+=`<line x1="${x0+s*dx}" x2="${x0+s*dx}" y1="${y0}" y2="${y0+4*dy}" stroke="currentColor" stroke-width="1.4"/>`;
 for(let f=0;f<=4;f++)o+=`<line x1="${x0}" x2="${x0+5*dx}" y1="${y0+f*dy}" y2="${y0+f*dy}" stroke="currentColor" stroke-width="${f===0&&!off?4:1.2}"/>`;
 v.fr.forEach((f,s)=>{const x=x0+s*dx;if(f<0)o+=`<text x="${x}" y="${y0-10}" text-anchor="middle" font-size="13" font-weight="800" fill="var(--mute)">×</text>`;else if(f===0)o+=`<circle cx="${x}" cy="${y0-13}" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/>`;else{const y=y0+(f-off-.5)*dy;o+=`<circle cx="${x}" cy="${y}" r="7" fill="currentColor"/>`}});
 return o+'</svg>'}
